# better-permit — the built-in permission presets plus graded ones that
# auto-approve routine, verifiable operations (plugin listing/toggling/
# installing, trusted paths and commands, an optional reviewer model, ...)
# instead of asking every time.
#
# Row 1 restates the whole built-in `permission` row: a patch replaces the
# targeted row's complete config, so every preset below must be declared here.
# Order matters — permission-presets infers a preset from the active sandbox
# mode + approval policy by taking the FIRST matching entry, so the
# conservative `workspace-write` stays ahead of the wider tiers and the derived
# default never silently becomes an auto-approving tier.
#
# Row 2 mounts the enforcement plugin itself.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      workspace-write-edits:
        sandbox: workspace-write
        approval: ask
        name: '工作区内 · 写入自动'
        description: '在工作区内写入、装依赖、跑构建自动放行；删除/覆盖、系统操作、往外发仍会询问，完全访问提权也仍需确认。'
      workspace-write-trusted:
        sandbox: workspace-write
        approval: ask
        name: '工作区内 · 受信放行'
        description: '在工作区内写入之上，受信目录内的路径与受信前缀的命令可自动提权；删除、系统操作与外发仍会询问。'
      workspace-write-ai:
        sandbox: workspace-write
        approval: ask
        name: '工作区内 · AI 判定'
        description: '常规读写由规则放行；超出台阶的危险操作交给你自己配置的评审模型判断，它说安全就直接执行，说不准或说危险才问你。系统层与对外发布始终由你确认。'
      workspace-write-guarded:
        sandbox: workspace-write
        approval: ask
        name: '工作区内 · 高危才问'
        description: '读写、装依赖、删除都自动放行；只有系统层操作、对外发布和识别不出的命令才会询问。'
      workspace-write-autopilot:
        sandbox: workspace-write
        approval: ask
        name: '工作区内 · 自动放行'
        description: '自动批准全部沙箱提权与其它审批请求；移除插件、版本豁免与安装脚本仍需确认。'
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: better-permit
      name: 'better-permit'
      config:
        # 让它只在 profile 里生效、可随时改这些值。
        inheritParentTier: true
        # 审批等待上限（毫秒）。超时后这次操作会被暂缓：请求按“暂不执行”结束，
        # 并在模型的下一步工具调用时告知它——不要重试，继续做不依赖它的部分。
        # 0（默认）= 一直等待用户回答。
        holdMs: 0
        # 超时时是否让评审模型给出“接下来怎么办”的建议（仅 AI 判定档位有效）。
        holdAdvice: true
        # 可选的评审模型：任何 OpenAI 兼容的 /chat/completions 端点。
        # 只有「工作区内 · AI 判定」档位会用到；key 建议只写在环境变量里。
        ai:
          baseUrl: ''
          model: ''
          apiKeyEnv: 'BETTER_PERMIT_API_KEY'
          timeoutMs: 8000
          minConfidence: 0.6
          maxHabits: 12
        # 受信档位里可以自动提权的命令前缀（只匹配“无 shell 元字符”的普通命令）。
        trustedCommands:
          - pnpm install
          - pnpm add
          - npm install
          - npm i
          - npm ci
